spring.application.name=gestion-taches

# Les identifiants (utilisateur et mot de passe) sont dans local.properties
spring.config.import=optional:file:./local.properties

# Où se trouve la base de données
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_taches?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Spring crée/met à jour les tables automatiquement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true